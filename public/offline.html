<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CloudLift · Offline</title>
<meta name="theme-color" content="#5458ee">
<style>
:root{color-scheme:light dark;--bg:#f5f6fa;--card:#fff;--ink:#171c2a;--muted:#5d667c;--line:#e3e6ee;--primary:#5458ee}
@media (prefers-color-scheme:dark){:root{--bg:#0d1017;--card:#161a24;--ink:#eceff5;--muted:#a3abbd;--line:#293043;--primary:#8487ff}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(400px,100%);text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 24px}
img{width:72px;height:72px;border-radius:18px}
h1{margin:16px 0 6px;font-size:22px}
p{margin:0 0 20px;color:var(--muted)}
button{padding:12px 22px;border:0;border-radius:10px;background:var(--primary);color:#fff;font:inherit;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Can't reach CloudLift</h1>
  <p>Your phone or computer is offline, or your CloudLift server isn't running. Transfers already started keep going on the server.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <p id="changeServer" hidden style="margin:16px 0 0"><a href="#" onclick="CloudLiftApp.changeServer();return false" style="color:var(--primary);font-weight:600">Use a different server</a></p>
</main>
<script>if(window.CloudLiftApp)document.getElementById('changeServer').hidden=false</script>
</body>
</html>
