<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skipped files - CloudLift</title>
<script>(function(){const t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
:root{--primary:#7e82ff;--ink:#e3e7ee;--muted:#94a3b8;--line:#2e3649;--surface:#1e2433;--surface-alt:#262d3e;--input-bg:#161a25;--btn-bg:#2a3248;--btn-hover:#353e5a;--danger:#fb7185;--shadow:0 4px 12px #00000045,0 8px 24px #00000030}
[data-theme="light"]{--primary:#696cff;--ink:#384152;--muted:#8590a5;--line:#e7eaf0;--surface:#fff;--surface-alt:#f8f8ff;--input-bg:#fff;--btn-bg:#f0f0ff;--btn-hover:#dfdfff;--danger:#ff3e5d;--shadow:0 2px 6px #43597112,0 8px 24px #4359710d}
*{box-sizing:border-box}body{margin:0;background:var(--surface-alt);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.top{background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow);padding:18px 24px}.top-inner,.content{max-width:1440px;margin:auto}.brand{color:var(--primary);font-size:21px;font-weight:800;text-decoration:none}.brand-mark{display:inline-grid;place-items:center;width:34px;height:34px;margin-right:8px;border-radius:10px;background:linear-gradient(135deg,#696cff,#8d8fff);color:white}.content{padding:28px 24px 48px}.heading{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}.eyebrow{color:var(--primary);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin:0 0 5px}.heading h1{margin:0;font-size:26px}.heading p{margin:5px 0 0;color:var(--muted)}.back{color:var(--primary);font-weight:700;text-decoration:none}.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:20px}.summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}.stat{background:var(--surface-alt);border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:150px}.stat b{display:block;font-size:20px}.stat span{color:var(--muted);font-size:12px}.controls{display:grid;grid-template-columns:minmax(220px,1fr) 260px auto;gap:12px;margin-bottom:18px}.controls input,.controls select,.button{font:inherit;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--input-bg);color:var(--ink)}.button{background:var(--btn-bg);color:var(--primary);font-weight:700;text-decoration:none;cursor:pointer;text-align:center}.button:hover{background:var(--btn-hover)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;background:var(--surface-alt)}tbody tr:last-child td{border-bottom:0}td{overflow-wrap:anywhere}.folder,.reason{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions a,.actions summary{color:var(--primary);font-size:12px;font-weight:700;cursor:pointer}.details{margin-top:8px;color:var(--muted);font-size:11px;white-space:pre-wrap}.empty,.error{padding:28px;text-align:center;color:var(--muted)}.error{color:var(--danger)}.more{display:block;margin:18px auto 0}.hidden{display:none}@media(max-width:700px){.content{padding:20px 12px}.top{padding:14px 12px}.heading{align-items:start;flex-direction:column}.controls{grid-template-columns:1fr}.card{padding:14px}}
</style>
</head>
<body>
<header class="top"><div class="top-inner"><a class="brand" href="/"><span class="brand-mark">↗</span>CloudLift</a></div></header>
<main class="content">
  <div class="heading"><div><p class="eyebrow">Transfer details</p><h1>Skipped files</h1><p id="jobLabel">Loading skipped files…</p></div><a class="back" href="/">← Back to CloudLift</a></div>
  <section class="card">
    <div class="summary"><div class="stat"><b id="totalCount">0</b><span>Files shown</span></div><div class="stat"><b id="totalSize">0 B</b><span>Total size</span></div></div>
    <div class="controls"><input id="search" type="search" placeholder="Search by name or folder" aria-label="Search skipped files"><select id="typeFilter" aria-label="Filter by file type"><option value="">All file types</option></select><a id="csv" class="button" href="#">Download CSV</a></div>
    <div id="message" class="empty">Loading…</div>
    <div id="tableWrap" class="table-wrap hidden"><table><thead><tr><th>Name</th><th>Folder</th><th>Type</th><th>Size</th><th>Reason</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
    <button id="more" class="button more hidden" type="button">Show more</button>
  </section>
</main>
<script>
const $=id=>document.getElementById(id), params=new URLSearchParams(location.search), job=params.get('job');let files=[],shown=200;
const fmt=n=>{n=Number(n)||0;const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n>=100||i===0?Math.round(n):n.toFixed(1)} ${u[i]}`};
const typeOf=f=>{const mime=String(f.mime||'').trim();if(mime)return mime.toLowerCase();const m=String(f.name||'').match(/\.([^.]+)$/);return m?`.${m[1].toLowerCase()}`:'Other'};const text=(el,value)=>{el.textContent=String(value??'');return el};
function filtered(){const q=$('search').value.trim().toLowerCase(),type=$('typeFilter').value;return files.filter(f=>(!q||`${f.name} ${f.dir}`.toLowerCase().includes(q))&&(!type||typeOf(f)===type))}
function addAction(cell,label,url){const a=document.createElement('a');a.className='button';a.href=url;a.target='_blank';a.rel='noopener';text(a,label);cell.append(a)}
function render(){const list=filtered(),page=list.slice(0,shown),tbody=$('rows');tbody.replaceChildren();text($('totalCount'),list.length);text($('totalSize'),fmt(list.reduce((n,f)=>n+(Number(f.size)||0),0)));$('message').classList.toggle('hidden',!!list.length);$('tableWrap').classList.toggle('hidden',!list.length);text($('message'),files.length?'No files match your search or filter.':'No skipped files found.');for(const f of page){const tr=document.createElement('tr'),name=document.createElement('td'),folder=document.createElement('td'),type=document.createElement('td'),size=document.createElement('td'),reason=document.createElement('td'),actions=document.createElement('td');text(name,f.name);text(folder,f.dir||'/');folder.className='folder';text(type,typeOf(f));text(size,fmt(f.size));text(reason,f.error||'Unsupported by destination');reason.className='reason';actions.className='actions';addAction(actions,'Open in OneDrive',`/api/files/${encodeURIComponent(f.id)}/open`);addAction(actions,'Download',`/api/files/${encodeURIComponent(f.id)}/download`);const details=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('div');text(summary,'View details');text(pre,`File ID: ${f.id}\nOneDrive item ID: ${f.item_id}\nMIME type: ${f.mime||'unknown'}\nReason: ${f.error||'Unsupported by destination'}`);pre.className='details';details.append(summary,pre);actions.append(details);tr.append(name,folder,type,size,reason,actions);tbody.append(tr)}$('more').classList.toggle('hidden',page.length>=list.length)}
async function load(){if(!job||!/^\d+$/.test(job)){text($('message'),'A valid job ID is required.');$('csv').classList.add('hidden');return}try{const r=await fetch(`/api/jobs/${encodeURIComponent(job)}/skipped`);if(!r.ok)throw new Error(`Request failed (${r.status})`);files=await r.json();text($('jobLabel'),`Job #${job} · ${files.length} skipped file${files.length===1?'':'s'}`);$('csv').href=`/api/jobs/${encodeURIComponent(job)}/skipped.csv`;const counts=new Map();files.forEach(f=>counts.set(typeOf(f),(counts.get(typeOf(f))||0)+1));for(const [type,count] of [...counts].sort((a,b)=>a[0].localeCompare(b[0]))){const o=document.createElement('option');o.value=type;text(o,`${type} (${count})`);$('typeFilter').append(o)}render()}catch(e){text($('message'),e.message);$('message').className='error'}}
$('search').addEventListener('input',()=>{shown=200;render()});$('typeFilter').addEventListener('change',()=>{shown=200;render()});$('more').onclick=()=>{shown+=200;render()};load();
</script>
</body>
</html>
